<div class="card">
<h1>일일결산은 이제 <b>Acro CRM</b> 에서 합니다</h1>
<div>Acro CRM → <b>결산</b> 탭에서 단말기·권종·지출만 넣고 <b>④ 제출</b>을 누르세요.<br>
OK차트 숫자는 복사하지 않아도 됩니다(서버가 직접 읽습니다). 결산원장·슬랙 #결산 카드·PDF 는 전과 같이 나갑니다.</div>
<div class="m">이 결산 앱(위저드)은 2026-09-25 에 은퇴했습니다. 지난 결산 이력은 CRM 결산 탭 '⑤ 결산 이력'에서 봅니다.</div>
