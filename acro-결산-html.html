<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아크로한의원 일일결산 위저드 v2</title>
<style>
:root{--amber:#b45309;--amber-bg:#fffbeb;--green:#15803d;--red:#b91c1c;--gray:#6b7280;--line:#e5e7eb;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
body{background:#f8f7f4;color:#1f2937;min-height:100vh;display:flex;justify-content:center;padding:24px 12px;}
.app{width:100%;max-width:640px;}
h1{font-size:20px;font-weight:800;margin-bottom:4px;}
.sub{color:var(--gray);font-size:13px;margin-bottom:20px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.q{font-size:17px;font-weight:700;margin-bottom:4px;}
.hint{font-size:13px;color:var(--gray);margin-bottom:14px;line-height:1.5;}
textarea{width:100%;min-height:140px;border:1.5px dashed #d1d5db;border-radius:10px;padding:12px;font-size:12px;font-family:monospace;resize:vertical;}
textarea:focus{outline:none;border-color:var(--amber);}
input[type=text],input[type=tel]{width:100%;border:1.5px solid #d1d5db;border-radius:10px;padding:12px 14px;font-size:18px;text-align:right;}
input:focus{outline:none;border-color:var(--amber);}
.btn{display:inline-block;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-p{background:var(--amber);color:#fff;}
.btn-s{background:#f3f4f6;color:#374151;}
.btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.btn:disabled{opacity:.4;cursor:default;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f3f4f6;font-size:14px;}
.kv b{font-variant-numeric:tabular-nums;}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}
.tag-ok{background:#dcfce7;color:var(--green);} .tag-warn{background:#fee2e2;color:var(--red);} .tag-wait{background:#fef3c7;color:var(--amber);}
.prog{display:flex;gap:4px;margin-bottom:6px;}
.prog i{flex:1;height:10px;border-radius:3px;background:#e5e7eb;cursor:pointer;}
.prog i.on{background:var(--amber);}
.prog i.cur{outline:2px solid #92400e;}
.prog-hint{font-size:11.5px;color:#9ca3af;margin-bottom:12px;}
.denoms{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.den{display:flex;align-items:center;gap:8px;}
.den label{width:74px;font-size:14px;font-weight:600;}
.den input{flex:1;font-size:16px;padding:8px 10px;}
.den span{font-size:12px;color:var(--gray);width:84px;text-align:right;font-variant-numeric:tabular-nums;}
.exlist{margin:10px 0;}
.exrow{display:flex;gap:8px;margin-bottom:8px;}
.exrow input:first-child{text-align:left;font-size:14px;flex:2;}
.exrow input:last-child{flex:1;}
.suggest{background:var(--amber-bg);border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.6;}
.big{font-size:26px;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums;}
.spin{margin:30px auto;width:36px;height:36px;border:4px solid #eee;border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.summary-line{background:#1f2937;color:#fff;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin:12px 0;word-break:keep-all;}
.foot{font-size:11.5px;color:#9ca3af;text-align:center;margin-top:18px;line-height:1.6;}
.linkish{background:none;border:none;color:var(--amber);font-size:13px;cursor:pointer;text-decoration:underline;padding:0;}
.carrybox{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#1e40af;margin-bottom:14px;line-height:1.6;}
.radio-row{display:flex;gap:8px;margin:8px 0 14px;}
.radio-row button{flex:1;border:1.5px solid #d1d5db;background:#fff;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;}
.radio-row button.sel{border-color:var(--amber);background:var(--amber-bg);font-weight:700;}
/* ===== A4 인쇄 ===== */
#printSheet{display:none;}
@page{size:A4;margin:14mm;}
@media print{
  body{background:#fff;padding:0;display:block;}
  .app>*:not(#printSheet){display:none!important;}
  #printSheet{display:block!important;}
}
#printSheet{font-size:12px;color:#111;}
#printSheet .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #111;padding-bottom:8px;margin-bottom:14px;}
#printSheet .ph h2{font-size:20px;letter-spacing:2px;}
#printSheet .ph .pd{font-size:12px;text-align:right;color:#374151;line-height:1.5;}
#printSheet table{width:100%;border-collapse:collapse;margin-bottom:14px;}
#printSheet th,#printSheet td{border:1px solid #9ca3af;padding:6px 9px;text-align:right;font-variant-numeric:tabular-nums;}
#printSheet th{background:#f3f4f6;text-align:center;font-size:11.5px;}
#printSheet td:first-child,#printSheet th:first-child{text-align:left;}
#printSheet .sec{font-size:13px;font-weight:800;margin:12px 0 6px;}
#printSheet .signs{display:flex;gap:14px;margin-top:26px;}
#printSheet .sign{flex:1;border:1px solid #9ca3af;border-radius:6px;padding:10px 12px 34px;font-size:12px;color:#374151;}
#printSheet .pfoot{margin-top:14px;font-size:10.5px;color:#6b7280;text-align:center;}
</style>
</head>

<div class="app">
  <h1>📊 일일결산 위저드</h1>

function parseOkchart(raw){
  var lines = raw.split(/\r?\n/).filter(function(l){return l.trim()!=="";});
  var date="", sIdx=-1, pIdx=-1;
  lines.forEach(function(ln,i){
    if(ln.replace(/\s/g,"").indexOf("일일결산표")>=0){ var m=ln.match(/(\d{4}-\d{2}-\d{2})/); if(m) date=m[1]; }
    var first=(ln.split("\t")[0]||"").trim();
    if(first==="내원환자수") sIdx=i;
    if(first==="환자이름") pIdx=i;
  });
  var summary={};
  if(sIdx>=0 && lines[sIdx+1]){
    var h=lines[sIdx].split("\t"), v=lines[sIdx+1].split("\t");
    h.forEach(function(k,i){ summary[k.trim()]=num(v[i]); });
  }
  var patients=[];
  if(pIdx>=0){
    var ph=lines[pIdx].split("\t").map(function(x){return x.trim();});
    for(var i=pIdx+1;i<lines.length;i++){
      var c=lines[i].split("\t"); if(c.length<5) continue;
      var row={}; ph.forEach(function(k,j){ row[k]=c[j]; }); patients.push(row);
    }
  }
  return { date:date, summary:summary, patients:patients, ok:sIdx>=0 };
}

  var s = S.parsed.summary;
  var okCard=num(s["카드수납"]), okBank=num(s["통장회수"]), okCash=num(s["현금수납"]),
      okTotal=num(s["수납총액"]), okRefund=num(s["환불총액"]), okMisu=num(s["미수금"]);
  var refCash=num(s["현금환불"]), refCard=num(s["카드환불"]), refBank=num(s["통장환불"]);
  var recovCash=num(s["현금회수"]), recovCard=num(s["카드회수"]);   // 미수금 회수 — 수납총액 밖. 판정식에는 넣지 않고 감지만 한다(드문 케이스)
  var allthat=num(S.allthat), smartro=num(S.smartro);
  var delivCard = S.delivCardCnt * CFG.DELIVERY_UNIT;
  var expenseSum = S.expenses.reduce(function(a,b){return a+num(b.amt);},0);
  // 사유 확인된 차이 보정 — 실측(단말/입금/금고)이 차트 기대보다 많으면 +, 적으면 −. 사유와 함께 기록되고 해당 레일 차이에서 상쇄된다.
  var adjC=0,adjB=0,adjS=0;
  S.adjusts.forEach(function(a){ var v=num(a.amt); if(!v) return; if(a.rail==="통장") adjB+=v; else if(a.rail==="금고") adjS+=v; else adjC+=v; });
  // ① 카드 레일: 단말 합계 − 카드택배비 − 스마트로수수료(4%) − EMS = OK차트 카드수납(매출)
  //    스마트로(해외카드): 표시액=(진료비+EMS)×(1+수수료). 진료비만 매출. 표시액에서 수수료·EMS를 역산 제거.
  //    카드환불(취소)이 있는 날: 단말 마감이 취소 차감된 순액일 수 있음 → 양쪽 다 시도해 맞는 쪽 자동 채택
  var smartroRev = num(S.smartroRev);                                  // 스마트로 진료비(매출)
  var smBase = smartro>0 ? Math.round(smartro/(1+CFG.SMARTRO_FEE)) : 0; // 진료비+EMS (수수료 제거)
  var smFee  = smartro - smBase;                                       // 스마트로 수수료(4%) — 매출 아님
  var ems    = smartro>0 ? (smBase - smartroRev) : 0;                  // EMS(국제택배) — 매출 아님
  var termCard = allthat + smartro - delivCard - smFee - ems;          // = allthat + smartroRev − delivCard
  var grossDiff = termCard - okCard - adjC;
  var netDiff = termCard - (okCard - refCard) - adjC;
  var cardMode="gross", cardDiff=grossDiff, cardModeNote="";
  if(refCard>0){
    var grossOk=Math.abs(grossDiff)<=CFG.TOLERANCE, netOk=Math.abs(netDiff)<=CFG.TOLERANCE;
    if(S.refCardToday==="today"){ // 직원 답: 오늘 취소함 → 순액 마감 기대
      if(netOk){cardMode="net";cardDiff=netDiff;}
      else if(grossOk){cardMode="gross";cardDiff=grossDiff;cardModeNote="답변(오늘 취소)과 달리 단말이 총액으로 마감됨 — 요확인";}
      else {cardMode="net";cardDiff=netDiff;}
    } else if(S.refCardToday==="other"){ // 답: 취소 안 함 → 총액 마감 기대
      if(grossOk){cardMode="gross";cardDiff=grossDiff;}
      else if(netOk){cardMode="net";cardDiff=netDiff;cardModeNote="답변(취소 안 함)과 달리 단말이 취소 차감돼 있음 — 요확인";}
      else {cardMode="gross";cardDiff=grossDiff;}
    } else { // 무응답 폴백: 자동 판별
      if(!grossOk && netOk){cardMode="net";cardDiff=netDiff;}
    }
  }
  // ② 통장 레일: 실측 입금 = 통장회수 + 통장택배비(4,000×n) − 정산대기(서울페이·제로페이·앱결제)
  var bankReal = (bankAuto!==null) ? bankAuto.sum : num(S.bankInManual);
  var seoul = num(S.seoulpayToday);
  var zero = num(S.zeropayToday);                     // 제로페이: 차트는 통장, 실입금은 T+1~2
  var appPay = num(S.appPayToday);                    // 앱결제: 차트는 통장, 실입금은 다른 통장 → 이 레일에서 제외
  var pending = seoul + zero + appPay;                // 정산대기 합계
  var rawBankDiff = bankReal - (okBank - pending) - adjB;
  var delivBankCnt = (rawBankDiff>0 && rawBankDiff % CFG.DELIVERY_UNIT===0) ? rawBankDiff/CFG.DELIVERY_UNIT : 0;
  var bankDiff = rawBankDiff - delivBankCnt*CFG.DELIVERY_UNIT;
  // ③ 현금(금고) 폐쇄회계: 전일금고 + 현금수납 − 현금지출 − 현금환불 = 실측
  var prevSafeEff = effPrevSafe();
  var expectSafe = (prevSafeEff===null? null : num(prevSafeEff) + okCash - expenseSum - refCash);
  var denomTotal = CFG.DENOMS.reduce(function(a,d){return a+d*num(S.denom[d]);},0)+num(S.denomEtc);
  var safeDiff = (expectSafe===null)? null : denomTotal - expectSafe - adjS;
  return {
    ok:{card:okCard,bank:okBank,cash:okCash,total:okTotal,refund:okRefund,misu:okMisu},
    refund:{cash:refCash,card:refCard,bank:refBank}, cardMode:cardMode, cardModeNote:cardModeNote,
    termCard:termCard, cardDiff:cardDiff, delivCard:delivCard, ems:ems, fee:smFee, smartroRev:smartroRev, smBase:smBase, smartroShown:smartro,
    bankReal:bankReal, bankDiff:bankDiff, delivBankCnt:delivBankCnt, seoul:seoul, zero:zero, appPay:appPay, pending:pending,
    recov:{cash:recovCash, card:recovCard, total:recovCash+recovCard},
    expenseSum:expenseSum, expectSafe:expectSafe, denomTotal:denomTotal, safeDiff:safeDiff,
    adj:{card:adjC,bank:adjB,safe:adjS},
    prevSafeUsed:prevSafeEff, prevSafeSource:(S.prevSafeIn!==null && S.prevSafeIn!=="")?"수동":"자동이월",
    pass:{
      card: Math.abs(cardDiff)<=CFG.TOLERANCE,
      bank: Math.abs(bankDiff)<=CFG.TOLERANCE,
      safe: safeDiff===null? null : Math.abs(safeDiff)<=CFG.TOLERANCE
    }
  };
}

var STEPS = 9; // 0붙여넣기 1확인 2환불확인(조건부) 3올댓 4스마트로 5지출 6택배 7금고 8판정/완료
function hasRefund(){ return S.parsed && num(S.parsed.summary["환불총액"])>0; }

function render(){
  var el=document.getElementById("stage");
  document.getElementById("prog").innerHTML = Array.from({length:STEPS},function(_,i){
    return '<i class="'+(i<=S.step?'on ':'')+(i===S.step?'cur':'')+'" title="'+STEP_NAMES[i]+'" onclick="jumpTo('+i+')"></i>';
  }).join("");
  el.innerHTML = VIEWS[S.step]();
  var f=el.querySelector("input,textarea"); if(f) f.focus();
}
function go(n){ S.step=n; if(n>(S.maxStep||0)) S.maxStep=n; render(); window.scrollTo(0,0); }

  if(n>(S.maxStep||0)) return;                 // 아직 안 간 단계로는 점프 금지
  if(n>=1 && !S.parsed) return;                // 붙여넣기 전이면 이동 불가
  if(n===2 && !hasRefund()) n=3;               // 환불 없는 날은 환불 단계 생략
  if(n===S.step) return;
  go(n);
}

/* ===== 전일누계 확인·보정 =====
   누계는 결산원장 체인을 타고 자동으로 이어진다. 다만 월 리셋이 없던 시기의 기록에는 지난달 값이

var CUMKEYS=[["통장","통장수입"],["카드","카드 수입"],["매출","매출"],["지출","지출"],["환불","환불"]];
function reportDate(){ return (S.parsed&&S.parsed.date)||todayStr(); }
function copyCum(c){ var o={}; CUMKEYS.forEach(function(k){ o[k[0]]=num(c&&c[k[0]]); }); return o; }
function cumSetK(k,v){ if(!S.prevCumIn) S.prevCumIn=copyCum(effPrevCum(reportDate())); S.prevCumIn[k]=num(v); render(); }
function cumZero(){ S.prevCumIn=zeroCum(); S.cumEdit=true; render(); }         // 이번 달을 오늘부터 0으로 다시 세기
function cumAuto(){ S.prevCumIn=null; S.cumEdit=false; render(); }             // 자동값으로 되돌리기
function cumEditOn(){ S.cumEdit=true; render(); }
function cumBox(){
  var dt=reportDate(), info=prevCumInfo(dt), man=!!S.prevCumIn, cur=effPrevCum(dt);
  var stale=(info.src==="stale"), open=stale||S.cumEdit||man;
  var msg={
    resubmit:"같은 날 재제출이라 이 날의 <b>원래 전일누계</b>를 그대로 씁니다 (이중가산 없음).",
    month:"달이 바뀌었습니다 — 누계를 <b>0에서 다시 시작</b>합니다 (직전 기록 "+esc(String(info.from))+").",
    chain:esc(String(info.from))+" 결산에서 이어받았습니다.",
    seed:"기준값("+esc(String(info.from))+")에서 시작합니다.",
    stale:"직전 결산("+esc(String(info.from))+")은 <b>월 리셋이 반영되기 전</b>에 제출됐습니다 — 그 누계에 <b>지난달 값이 섞여 있을 수 있습니다</b>. 오늘 한 번만 확인해 주세요. 아래 값이 <b>이번 달 어제까지의 합계</b>가 맞으면 그대로 두고, 아니면 고치거나 [0부터]를 누르세요."
  }[info.src]||"";
  var rows=CUMKEYS.map(function(k){

    '<div class="hint">이번 달 <b>어제까지의 합계</b>입니다. 여기에 오늘치를 더한 값이 보고서의 "총 ○○"로 나갑니다.<br>'+msg+'</div>'+
    rows+

    '<div class="btn-row" style="justify-content:flex-start">'+
      (open?'':'<button class="btn btn-s" onclick="cumEditOn()">✎ 고치기</button>')+
      '<button class="btn btn-s" onclick="cumZero()">이번 달 0부터</button>'+
      (man?'<button class="btn btn-s" onclick="cumAuto()">↺ 자동값으로</button>':'')+

/* 전일 누계: 결산원장 마지막 제출의 보고서JSON 체인. 같은 날 재제출은 그 제출의 전일누계로 대체(이중가산 방지). 없으면 시드
   누계는 월 단위다 — 달이 바뀌면 0에서 다시 시작한다 (260802: 8/1에 7월 누계가 그대로 승계돼 환불이 이월된 건 수정) */
function ym(d){ return String(d||"").slice(0,7); }
function zeroCum(){ return {통장:0, 지출:0, 환불:0, 카드:0, 매출:0}; }
function prevCumInfo(dt){
  var lr=null;
  try{ lr=(carry.prevReport&&String(carry.prevReport).length>2)?JSON.parse(carry.prevReport):null; }catch(e){}
  if(lr&&lr.누계){
    if(lr.날짜===dt&&lr.전일누계) return {cum:lr.전일누계, src:"resubmit", from:lr.날짜};  // 같은 날 재제출 — 이중가산 방지
    if(ym(lr.날짜)!==ym(dt))      return {cum:zeroCum(),   src:"month",    from:lr.날짜};  // 달이 바뀜 — 누계 리셋
    /* 같은 달이지만 월 리셋 전에 만들어진 기록 — 그 안에 지난달 누계가 남아 있을 수 있다. 사람이 확인해야 한다. */
    if(CFG.CUM_TRUST_FROM && lr.날짜<CFG.CUM_TRUST_FROM && dt>=CFG.CUM_TRUST_FROM)
      return {cum:lr.누계, src:"stale", from:lr.날짜};
    return {cum:lr.누계, src:"chain", from:lr.날짜};
  }
  var sd=CFG.SEED_CUM;
  if(ym(sd.date)!==ym(dt)) return {cum:zeroCum(), src:"month", from:sd.date};  // 시드도 같은 규칙
  return {cum:{통장:sd.통장, 지출:sd.지출, 환불:sd.환불, 카드:sd.카드, 매출:sd.매출}, src:"seed", from:sd.date};
}
function prevCum(dt){ return prevCumInfo(dt).cum; }
/* 실제 보고서가 쓰는 전일누계 — 담당자가 보정했으면 그 값 */
function effPrevCum(dt){ return S.prevCumIn ? S.prevCumIn : prevCum(dt); }

/* v3.1: 공식 양식을 엑셀 파일로 산출 (HTML표 기반 .xls — 병합·테두리 유지, 엑셀 더블클릭으로 열림) */

/* v2.9: 결산원장 전체 → 엑셀(CSV·BOM) 다운로드 백업 */
function histExcel(){
  var msg=document.getElementById("histXlsMsg");
  if(msg) msg.textContent="결산원장 전체를 불러오는 중...";
  fetch(CFG.GAS_URL+"?action=history&n=3650&k="+encodeURIComponent(CFG.APP_KEY)).then(function(r){return r.json();}).then(function(j){
    var rows=(j&&j.rows)||[];
    if(!rows.length){ if(msg) msg.textContent="백업할 결산 기록이 없습니다."; return; }
    var heads=Object.keys(rows[0]);
    function cell(v){ v=(v===null||v===undefined)?"":String(v); return '"'+v.replace(/"/g,'""')+'"'; }
    var lines=[heads.map(cell).join(",")];
    for(var i=rows.length-1;i>=0;i--){ lines.push(heads.map(function(h){return cell(rows[i][h]);}).join(",")); } // 시트 순서(과거→최근)
    var csv="﻿"+lines.join("\r\n");
    var d=new Date(), ymd=String(d.getFullYear()).slice(2)+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="결산백업_"+ymd+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    if(msg) msg.textContent="✅ "+rows.length+"건 백업 완료 — 다운로드 폴더의 결산백업_"+ymd+".csv (엑셀에서 바로 열립니다)";
  }).catch(function(e){ if(msg) msg.textContent="⚠ 불러오기 실패 — 잠시 후 다시 시도해 주세요."; });
}

    var st=monDayStatus(d);
    h+='<tr style="border-top:1px solid #eee"><td style="padding:5px 7px;text-align:left"><b>'+esc(d.date.slice(5))+'</b></td>'
      +'<td style="padding:5px 7px;text-align:right">'+fmt(d.rev)+'</td>'
      +'<td style="padding:5px 7px;text-align:right">'+fmt(d.pay)+'</td>'
      +'<td style="padding:5px 7px;text-align:right">'+(d.refund?fmt(d.refund):"·")+'</td>'
      +(M.reconciled?'<td style="padding:5px 7px;text-align:center;color:'+(col[st.cls]||"#666")+'" title="'+esc(st.note)+'">'+esc(st.t)+'</td>':'')+'</tr>';
  });
  h+='</table></div>';
  /* 합계 */
  var kv=[["총매출 (총진료비)",won(s.rev)],["총수납",won(s.pay)],["환불 (비용)",won(s.refund)],["미수금",won(s.misu)]];
  h+=kv.map(function(r){return '<div class="kv"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>';}).join("");
  h+='<div class="btn-row" style="flex-wrap:wrap"><button class="btn btn-s" onclick="monthlyShow()">← 다시 붙여넣기</button>'
    +(CFG.GAS_URL!==""&&!M.reconciled?'<button class="btn btn-s" onclick="monthlyReconcile()">🔍 결산원장 대조</button>':'')
    +'<button class="btn btn-p" onclick="monthlyExcel()">📊 엑셀 산출</button></div>';
  h+='<div class="hint" id="monXlsMsg" style="margin-top:6px"></div></div>';
  document.getElementById("stage").innerHTML=h;
}
function monthlyReconcile(){
  if(CFG.GAS_URL===""){ var m=document.getElementById("monXlsMsg"); if(m) m.textContent="서버 연결이 없어 대조할 수 없어요."; return; }
  var m=document.getElementById("monXlsMsg"); if(m) m.textContent="결산원장 불러오는 중…";
  fetch(CFG.GAS_URL+"?action=history&n=90&k="+encodeURIComponent(CFG.APP_KEY)).then(function(r){return r.json();}).then(function(j){
    var rows=(j&&j.rows)||[]; var byDate={};
    rows.forEach(function(r){ var d=String(r["날짜"]).slice(0,10); if(!byDate[d]) byDate[d]=r; }); // history 최신순 → 같은날 최신 제출 유효
    MONTH.ledger=byDate; MONTH.reconciled=true; monthlyResult();
  }).catch(function(e){ var m2=document.getElementById("monXlsMsg"); if(m2) m2.textContent="⚠ 결산원장 불러오기 실패 — 네트워크/서버 확인"; });
}
function monTd(v,align){ return '<td style="text-align:'+(align||"right")+'">'+(typeof v==="number"?v:esc(String(v)))+'</td>'; }
function monthlyExcel(){
  var M=MONTH; if(!M){ return; }
  var s=M.sum;
  var ym=(M.active[0]&&M.active[0].date.slice(0,7))||"month";
  var style='<style>table{border-collapse:collapse}th,td{border:1px solid #999;padding:4px 9px;mso-number-format:"#,##0";text-align:right;font-family:"맑은 고딕",sans-serif;font-size:11pt}th{background:#1F3864;color:#fff;font-weight:bold;text-align:center}.def{border:none;text-align:left;font-size:10pt;color:#555}.tt{border:none;text-align:left;font-size:14pt;font-weight:bold}</style>';
  var html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+style+'</head><body>';
  html+='<table><tr><td colspan="9" class="tt">아크로한의원 월결산 — '+esc(ym)+' ('+esc(M.range)+')</td></tr>';
  html+='<tr><td colspan="9" class="def">매출 = OK차트 총진료비(총액). 환불은 매출에서 빼지 않고 비용으로 별도 계상. 지출(현금 실지출)은 일일결산에서 별도 집계.</td></tr></table>';
  html+='<table><tr><th>일자</th><th>내원</th><th>신규</th><th>매출(총진료비)</th><th>수납총액</th><th>카드수납</th><th>통장회수</th><th>환불</th><th>미수금</th></tr>';
  M.active.forEach(function(d){
    html+='<tr>'+monTd(d.date,"center")+monTd(d.visit)+monTd(d.nu)+monTd(d.rev)+monTd(d.pay)+monTd(d.card)+monTd(d.bank)+monTd(d.refund)+monTd(d.misu)+'</tr>';
  });
  html+='<tr><th style="text-align:right">합계</th>'+monTd(s.visit)+monTd(s.nu)+monTd(s.rev)+monTd(s.pay)+monTd(s.card)+monTd(s.bank)+monTd(s.refund)+monTd(s.misu)+'</tr></table>';
  html+='<table><tr><th>요약</th><th>금액</th></tr>'
    +'<tr>'+monTd("총매출 (총진료비)","left")+monTd(s.rev)+'</tr>'
    +'<tr>'+monTd("총수납","left")+monTd(s.pay)+'</tr>'
    +'<tr>'+monTd("환불 (비용)","left")+monTd(s.refund)+'</tr>'
    +'<tr>'+monTd("미수금","left")+monTd(s.misu)+'</tr>'
    +'<tr>'+monTd("매출 − 환불 (참고)","left")+monTd(s.rev-s.refund)+'</tr></table>';
  html+='</body></html>';
  var blob=new Blob(["﻿"+html],{type:"application/vnd.ms-excel;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="아크로_월결산_"+ym+".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  var msg=document.getElementById("monXlsMsg"); if(msg) msg.textContent="엑셀 다운로드됨: 아크로_월결산_"+ym+".xls";
}
function init(){
  document.getElementById("todayLabel").textContent=todayStr();
  try{
    var c=JSON.parse(localStorage.getItem("acro_settle_carry")||"null");
    if(c && c.prevSafe!==undefined){ carry.prevSafe=c.prevSafe; carry.prevDate=c.prevDate; carry.prevDenom=c.prevDenom; carry.prevDenomEtc=c.prevDenomEtc; }
  }catch(e){}
  seedDenom();
  fetchBoot(todayStr(), false);
  render();
}
init();
</script>
