<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>비대면 응대 가이드 · 원내 전용</title>
<style>
  :root { --bg:#f3f7f4; --card:#ffffff; --ink:#1f2d27; --sub:#5b6b63; --accent:#3d8b64; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a17; --card:#1c2420; --ink:#e7efe9; --sub:#9db0a5; --accent:#6cc396; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:18px; padding:28px 24px; max-width:440px; width:100%; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .tag { display:inline-block; font-size:12px; font-weight:700; letter-spacing:1px; color:var(--accent); border:1px solid var(--accent);
          border-radius:999px; padding:2px 10px; }
  h1 { font-size:20px; margin:14px 0 6px; }
  p { margin:6px 0; color:var(--sub); }
  .en { font-size:13px; margin-top:16px; }
</style></head>
<body><div class="card">
  <span class="tag">🌿 원내 전용</span>
  <h1>비대면 응대 가이드</h1>
  <p>이 자료는 이제 원내에서만 열립니다.</p>
  <p>원내 와이파이에서 <b>아크로드 → 링크 모음</b>에서 같은 이름을 눌러 주세요.</p>
  <p class="en">This page is now available only inside the clinic.</p>
</div></body></html>
