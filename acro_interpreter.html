<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>아크로한의원 진료 통역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EE; --card:#FFFFFF; --ink:#23271F; --sub:#78806F; --line:#E4DFD2;
  --doc:#1E4B39; --doc-deep:#143426; --doc-soft:#E9F0EB;
  --pat:#2E4569; --pat-deep:#20334F; --pat-soft:#EAEEF5;
  --seal:#C23B2B; --gold:#B98A2F;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;
  background:var(--paper); color:var(--ink);
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
.serif{font-family:'Noto Serif KR','Pretendard',serif}
/* ---------- header ---------- */
header{flex-shrink:0; background:var(--paper); border-bottom:1px solid var(--line); padding:10px 16px 0;}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.wordmark{display:flex; align-items:baseline; gap:8px; white-space:nowrap;}
.wordmark .brand{font-family:'Noto Serif KR',serif; font-weight:900; font-size:17px; letter-spacing:-0.02em;}
.wordmark .role{font-size:11px; color:var(--sub); letter-spacing:0.14em; font-weight:600;}
.hbtns{display:flex; gap:6px;}
.icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icobtn:focus-visible{outline:2px solid var(--doc);outline-offset:2px}
.settings{display:none; gap:14px; padding:10px 2px 2px; flex-wrap:wrap; align-items:center;}
.settings.open{display:flex}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600;cursor:pointer;user-select:none;}
.opt input{accent-color:var(--doc);width:16px;height:16px;}
.btn-clear{margin-left:auto;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;}
/* ---------- language tabs ---------- */
.langs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;}
.langs::-webkit-scrollbar{display:none}
.lang{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.lang .fl{font-size:15px}
.lang.active{background:var(--pat);border-color:var(--pat);color:#fff;}
.lang:focus-visible{outline:2px solid var(--pat);outline-offset:2px}
/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.grp{display:flex;flex-direction:column;gap:6px;animation:up .18s ease-out;}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.grp{animation:none}}
.row{display:flex;align-items:flex-end;gap:8px;}
.row.L{justify-content:flex-start}
.row.R{justify-content:flex-end}
.tag{font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--sub);padding:0 4px;}
.bub{max-width:78%;padding:13px 17px;border-radius:var(--r);font-size:19px;font-weight:600;line-height:1.55;word-break:break-word;}
.row.L .bub{border-bottom-left-radius:6px}
.row.R .bub{border-bottom-right-radius:6px}
.b-ko{background:var(--doc);color:#fff;}
.b-tg{background:var(--pat);color:#fff;font-size:21px;}
.b-wait{background:var(--card);border:1px dashed var(--line);color:var(--sub);font-size:14px;font-weight:500;font-style:normal;}
.b-err{background:#FBEAE7;color:var(--seal);font-size:14px;font-weight:500;}
.spk{background:transparent;border:none;font-size:17px;cursor:pointer;opacity:.32;padding:4px;flex-shrink:0;border-radius:6px;}
.spk:hover,.spk:focus-visible{opacity:1}
.spk.on{opacity:1;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.dots{display:inline-flex;gap:4px;align-items:center;}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:d .9s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,100%{opacity:.25}50%{opacity:1}}
.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;}
.empty .mark{width:64px;height:64px;border-radius:18px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--card);}
.empty .t1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:18px;line-height:1.8;}
.empty .t2{font-size:13.5px;color:var(--sub);line-height:1.9;}
.empty b{font-weight:800}
/* ---------- bottom ---------- */
.bottom{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
.pads{display:flex;gap:10px;}
.pad{flex:1;height:86px;border-radius:20px;border:1.5px solid;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s;}
.pad:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pad .pname{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;letter-spacing:0.02em;}
.pad
