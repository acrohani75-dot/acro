<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>아크로한의원 진료 통역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EE; --card:#FFFFFF; --ink:#23271F; --sub:#78806F; --line:#E4DFD2;
  --doc:#1E4B39; --doc-deep:#143426; --doc-soft:#E9F0EB;
  --pat:#2E4569; --pat-deep:#20334F; --pat-soft:#EAEEF5;
  --seal:#C23B2B; --gold:#B98A2F;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;
  background:var(--paper); color:var(--ink);
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
.serif{font-family:'Noto Serif KR','Pretendard',serif}

/* ---------- header ---------- */
header{flex-shrink:0; background:var(--paper); border-bottom:1px solid var(--line); padding:10px 16px 0;}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.wordmark{display:flex; align-items:baseline; gap:8px; white-space:nowrap;}
.wordmark .brand{font-family:'Noto Serif KR',serif; font-weight:900; font-size:17px; letter-spacing:-0.02em;}
.wordmark .role{font-size:11px; color:var(--sub); letter-spacing:0.14em; font-weight:600;}
.hbtns{display:flex; gap:6px;}
.icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icobtn:focus-visible{outline:2px solid var(--doc);outline-offset:2px}
.settings{display:none; gap:14px; padding:10px 2px 2px; flex-wrap:wrap; align-items:center;}
.settings.open{display:flex}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600;cursor:pointer;user-select:none;}
.opt input{accent-color:var(--doc);width:16px;height:16px;}
.btn-clear{margin-left:auto;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;}

/* ---------- language tabs ---------- */
.langs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;}
.langs::-webkit-scrollbar{display:none}
.lang{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.lang .fl{font-size:15px}
.lang.active{background:var(--pat);border-color:var(--pat);color:#fff;}
.lang:focus-visible{outline:2px solid var(--pat);outline-offset:2px}

/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.grp{display:flex;flex-direction:column;gap:6px;animation:up .18s ease-out;}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.grp{animation:none}}
.row{display:flex;align-items:flex-end;gap:8px;}
.row.L{justify-content:flex-start}
.row.R{justify-content:flex-end}
.tag{font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--sub);padding:0 4px;}
.bub{max-width:78%;padding:13px 17px;border-radius:var(--r);font-size:19px;font-weight:600;line-height:1.55;word-break:break-word;}
.row.L .bub{border-bottom-left-radius:6px}
.row.R .bub{border-bottom-right-radius:6px}
.b-ko{background:var(--doc);color:#fff;}
.b-tg{background:var(--pat);color:#fff;font-size:21px;}
.b-wait{background:var(--card);border:1px dashed var(--line);color:var(--sub);font-size:14px;font-weight:500;font-style:normal;}
.b-err{background:#FBEAE7;color:var(--seal);font-size:14px;font-weight:500;}
.spk{background:transparent;border:none;font-size:17px;cursor:pointer;opacity:.32;padding:4px;flex-shrink:0;border-radius:6px;}
.spk:hover,.spk:focus-visible{opacity:1}
.spk.on{opacity:1;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.dots{display:inline-flex;gap:4px;align-items:center;}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:d .9s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,100%{opacity:.25}50%{opacity:1}}

.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;}
.empty .mark{width:64px;height:64px;border-radius:18px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--card);}
.empty .t1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:18px;line-height:1.8;}
.empty .t2{font-size:13.5px;color:var(--sub);line-height:1.9;}
.empty b{font-weight:800}

/* ---------- bottom ---------- */
.bottom{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;}
.pads{display:flex;gap:10px;}
.pad{flex:1;height:96px;border-radius:20px;border:1.5px solid;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s;}
.pad:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pad .pname{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;letter-spacing:0.02em;}
.pad .psub{font-size:12px;font-weight:600;opacity:.75;line-height:1.3;padding:0 6px;text-align:center;}
.pad.ko{border-color:var(--doc);color:var(--doc);background:var(--doc-soft);}
.pad.tg{border-color:var(--pat);color:var(--pat);background:var(--pat-soft);}
.pad.rec{color:#fff;transform:scale(1.02);}
.pad.ko.rec{background:var(--doc-deep);border-color:var(--doc-deep);}
.pad.tg.rec{background:var(--pat-deep);border-color:var(--pat-deep);}
.pad.rec::after{content:'';position:absolute;inset:-7px;border-radius:26px;border:2.5px solid var(--seal);
  animation:seal 1.1s ease-out infinite;pointer-events:none;}
@keyframes seal{0%{opacity:.9;transform:scale(.99)}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.pad.rec::after{animation:none;opacity:.9}}
.pad .rdot{display:none;width:9px;height:9px;border-radius:50%;background:var(--seal);}
.pad.rec .rdot{display:block;animation:blink .9s infinite}
.pad:disabled{opacity:.45;cursor:default}

/* ---------- 연속 통역 모드 ---------- */
.pad.cont{color:#fff;border-width:2px;border-color:var(--gold);}
.pad.ko.cont{background:var(--doc-deep);}
.pad.tg.cont{background:var(--pat-deep);}
.pad.cont .rdot{display:block;background:var(--gold);animation:blink 1.4s infinite;}
.pad.cont::after{content:'';position:absolute;inset:-7px;border-radius:26px;border:2.5px solid var(--gold);
  animation:seal 1.6s ease-out infinite;pointer-events:none;}
@media (prefers-reduced-motion:reduce){.pad.cont::after{animation:none;opacity:.9}}
.pad.cont.talk{border-color:var(--seal);}
.pad.cont.talk .rdot{background:var(--seal);animation:blink .6s infinite;}

/* ---------- 무전 (Slack 직통) ---------- */
.radio{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s;}
.radio:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.radio .rname{font-family:'Noto Serif KR',serif;font-weight:900;font-size:15px;letter-spacing:0.18em;}
.radio .rsub{font-size:11.5px;font-weight:600;opacity:.6;letter-spacing:0.02em;}
.radio .rdot2{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.radio.rec{background:var(--seal);border-color:var(--seal);transform:scale(1.01);}
.radio.rec .rdot2{background:#fff;animation:blink .9s infinite}
.radio.rec .rsub{opacity:.9}
.radio.rec::after{content:'';position:absolute;inset:-6px;border-radius:22px;border:2.5px solid var(--seal);
  animation:seal 1.1s ease-out infinite;pointer-events:none;}
@media (prefers-reduced-motion:reduce){.radio.rec::after{animation:none;opacity:.9}}

/* 무전 전송 확인 칩 (채팅 중앙) */
.chiprow{display:flex;justify-content:center;}
.chip{max-width:86%;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  color:var(--sub);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;word-break:break-word;}
.chip .cico{flex-shrink:0}
.chip.sent{border-color:var(--gold);color:var(--ink);}
.chip.fail{border-color:var(--seal);color:var(--seal);}

.trow{display:flex;gap:8px;}
.trow textarea{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;color:var(--ink);font-family:inherit;resize:none;max-height:64px;}
.trow textarea:focus{outline:none;border-color:var(--doc)}
.trow textarea::placeholder{color:#A9AFA0}
.btn-send{padding:9px 15px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:50;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 발신자 이름 설정 ---------- */
.veil{position:fixed;inset:0;background:rgba(35,39,31,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.veil.open{display:flex}
.namecard{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
.namecard .nt{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;}
.namecard .nd{font-size:13px;color:var(--sub);line-height:1.7;}
.namecard input{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;font-family:inherit;background:var(--paper);}
.namecard input:focus{outline:none;border-color:var(--doc)}
.namecard .nbtn{padding:13px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Serif KR',serif;}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="wordmark">
      <span class="brand">아크로한의원</span>
      <span class="role">진료 통역</span>
    </div>
    <div class="hbtns">
      <button class="icobtn" id="btnGear" title="설정" onclick="toggleSettings()">⚙︎</button>
    </div>
  </div>
  <div class="settings" id="settings">
    <label class="opt"><input type="checkbox" id="chkSpeak" checked onchange="autoSpeak=this.checked"> 자동 음성</label>
    <label class="opt"><input type="checkbox" id="chkOpus" onchange="useOpus=this.checked"> 정밀 번역</label>
    <label class="opt"><input type="checkbox" id="chkSlack" onchange="slackLog=this.checked"> Slack 기록</label>
    <button class="btn-clear" onclick="openNameModal()" style="margin-left:0">발신자 변경</button>
    <button class="btn-clear" onclick="clearAll()">초기화</button>
  </div>
  <div class="langs" id="langs"></div>
</header>

<div class="chat" id="chat"></div>

<div class="bottom">
  <div class="pads">
    <button class="pad ko" id="pad-ko">
      <span class="rdot"></span>
      <span class="pname">한국어</span>
      <span class="psub" id="sub-ko">꾹: 한 마디 · 탭: 연속</span>
    </button>
    <button class="pad tg" id="pad-tg">
      <span class="rdot"></span>
      <span class="pname" id="name-tg">日本語</span>
      <span class="psub" id="sub-tg">押しながら話す</span>
    </button>
  </div>
  <button class="radio" id="pad-radio">
    <span class="rdot2"></span>
    <span class="rname">무전</span>
    <span class="rsub" id="sub-radio">꾹 누르면 음성이 Slack으로</span>
  </button>
  <div class="trow">
    <textarea id="ta" rows="1" placeholder="직접 입력 (한국어/외국어 자동 감지)" onkeydown="taKey(event)"></textarea>
    <button class="btn-send" onclick="sendFromTa()">전송</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="veil" id="nameVeil">
  <div class="namecard">
    <div class="nt serif">무전 발신자 설정</div>
    <div class="nd">Slack 무전에 표시될 이름입니다.<br>이 기기에 저장되며, 한 번만 입력하면 됩니다.</div>
    <input id="nameInput" type="text" maxlength="12" placeholder="예: 임원장" onkeydown="if(event.key==='Enter')saveName()">
    <button class="nbtn" onclick="saveName()">저장</button>
  </div>
</div>

<script>
/* ================= 설정 ================= */
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyzJ1FiqTOYvfkdFGTLq5iHpgxiuZvzIH0qo8Q_MoCH9ZeOtKhXcuvXkp16DvWZ-JNuGQ/exec";

/* 무전 → GAS 프록시 경유 Slack 전송 (웹훅 URL은 스크립트 속성 SLACK_WEBHOOK_URL에 보관) */
/* 발신자 이름: 각자 폰에서 최초 1회 입력, 기기에 저장 (설정 ⚙에서 변경 가능) */
let radioName = '';
try { radioName = localStorage.getItem('acro_radio_name') || ''; } catch(e){}

const LANGS = {
  japanese:  { name:'日本語',   flag:'🇯🇵', code:'ja-JP', eng:'Japanese',            idle:'押しながら話す' },
  english:   { name:'English',  flag:'🇺🇸', code:'en-US', eng:'English',             idle:'Hold to speak' },
  chinese:   { name:'中文',     flag:'🇨🇳', code:'zh-CN', eng:'Simplified Chinese',  idle:'按住说话' },
  taiwanese: { name:'繁體中文', flag:'🇹🇼', code:'zh-TW', eng:'Traditional Chinese', idle:'按住說話' },
  thai:      { name:'ภาษาไทย', flag:'🇹🇭', code:'th-TH', eng:'Thai',                idle:'กดค้างเพื่อพูด' },
};

let curLang = 'japanese';
let history = [];           // {id, lang, ko, tgt, stage:'stt'|'tr'|'done'|'err', side}
let autoSpeak = true, useOpus = false, slackLog = false;
let ttsId = null;

/* ================= 연속 통역 설정 (필요시 여기서 조절) ================= */
const CONT = {
  SILENCE_MS: 1200,    // 이만큼 조용하면 문장 끝으로 판단
  THRESHOLD: 0.015,    // 음성 감지 민감도 (소음 많은 방이면 0.02~0.03으로 올릴 것)
  MIN_SPEECH_MS: 400,  // 이보다 짧은 소리는 무시 (기침, 노크 등)
  MAX_SEG_MS: 30000,   // 한 문장 최대 길이 (초과 시 강제로 잘라 통역)
  TAP_MS: 350,         // 이 시간보다 짧게 누르면 '탭'(연속 모드 토글)으로 간주
};

/* ================= 녹음 (MediaRecorder — 브라우저 음성인식 미사용) ================= */
let mediaStream = null;
let recorder = null, chunks = [], recSide = null, recStart = 0;
let pressed = { ko:false, tg:false, radio:false };

/* 연속 모드 상태 */
let contMode = null;          // null | 'ko' | 'tg'
let contRec = null, contChunks = [];
let contAC = null, contAnalyser = null, contTimer = null;
let contSpeaking = false, contSpeechStart = 0, contSilenceStart = 0, contHadSpeech = false, contSegStart = 0;
let contPausedByTTS = false;
let pendingContStop = false;

function pickMime(){
  const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

async function ensureMic(){
  if (mediaStream && mediaStream.active) return true;
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    return true;
  }catch(e){ return false; }
}
const MIC_HELP = '🎙 마이크 권한이 필요합니다.\n\n· 주소창 자물쇠 → 권한 → 마이크 → 허용\n· 카카오톡·인스타 인앱 화면이면 Chrome/Safari로 열어주세요';

async function pttStart(side, ev){
  if (ev) ev.preventDefault();
  if (recSide) return;
  /* 연속 모드가 켜진 패드를 다시 누르면 → 손 뗄 때 끔 */
  if (contMode && contMode === side){ pendingContStop = true; return; }
  /* 다른 패드의 연속 모드가 켜져 있으면 먼저 끄고 진행 */
  if (contMode) contStop(false);
  if (side === 'radio' && !radioName){ openNameModal(); return; }   // 이름 미설정 시 먼저 입력
  if (window.speechSynthesis) speechSynthesis.cancel();
  pressed[side] = true;
  if (!(await ensureMic())) { pressed[side]=false; alert(MIC_HELP); return; }
  if (!pressed[side]) return;                    // 권한 받는 사이 손 뗐으면 취소
  const mime = pickMime();
  if (!window.MediaRecorder) { alert('이 브라우저는 녹음을 지원하지 않습니다. Chrome/Safari로 열어주세요.'); return; }
  chunks = [];
  recorder = new MediaRecorder(mediaStream, mime ? { mimeType:mime } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => onRecStop();
  recSide = side; recStart = Date.now();
  setPadUI(side, true);
  recorder.start();
  setTimeout(()=>{ if (recSide===side && recorder && recorder.state==='recording') pttEnd(side); }, 60000); // 60초 안전장치
}

let skipNextPTTResult = false;
function pttEnd(side, ev){
  if (ev) ev.preventDefault();
  pressed[side] = false;
  if (pendingContStop && contMode === side){ pendingContStop = false; contStop(true); return; }
  if (recSide !== side) return;
  setPadUI(side, false);
  const isTap = side !== 'radio' && (Date.now() - recStart) < CONT.TAP_MS;
  if (recorder && recorder.state === 'recording') { try{ recorder.stop(); }catch(e){} }
  if (isTap){ skipNextPTTResult = true; contStart(side); }   // 짧게 탭 → 연속 모드 (제스처 내에서 시작)
}

async function onRecStop(){
  const side = recSide; recSide = null;
  const dur = Date.now() - recStart;
  const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || 'audio/webm' });
  chunks = [];
  if (skipNextPTTResult){ skipNextPTTResult = false; return; }   // 탭이었음 — 연속 모드로 전환됨
  if (dur < 350 || blob.size < 1200) { toast('너무 짧아요 — 꾹 누른 채 말해주세요'); return; }

  /* ---- 무전: 프록시가 인식+Slack 전송을 한 번에 처리 ---- */
  if (side === 'radio'){
    const entry = { id: Date.now(), side:'radio', stage:'stt' };
    history.push(entry); renderChat();
    try{
      const b64 = await blobToB64(blob);
      const res = await fetch(PROXY_URL, {
        method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'radio', audio:b64, mimeType: blob.type.split(';')[0], lang:'Korean', tag: radioName || '무전' })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (!data.text){
        history = history.filter(h => h.id !== entry.id); renderChat();
        toast('음성이 인식되지 않았어요'); return;
      }
      entry.radioText = data.text; entry.stage = 'done';
      renderChat(); toast('무전 전송됨');
    }catch(err){
      entry.stage = 'err'; entry.errMsg = '무전 실패: ' + err.message;
      renderChat();
    }
    return;
  }

  processSpeech(side, blob, true);
}

/* PTT·연속 모드 공용: 음성 blob → STT → 번역 */
async function processSpeech(side, blob, toastOnEmpty){
  const entry = { id: Date.now() + Math.random(), lang: curLang, side, stage:'stt' };
  history.push(entry); renderChat();

  try{
    const b64 = await blobToB64(blob);
    const langHint = side === 'ko' ? 'Korean' : LANGS[entry.lang].eng;
    const res = await fetch(PROXY_URL, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'stt', audio:b64, mimeType: blob.type.split(';')[0], lang: langHint })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const text = (data.text || '').trim();
    if (!text) {
      history = history.filter(h => h.id !== entry.id); renderChat();
      if (toastOnEmpty) toast('음성이 인식되지 않았어요');
      return;
    }
    if (side === 'ko') entry.ko = text; else entry.tgt = text;
    entry.stage = 'tr'; renderChat();
    await translateEntry(entry);
  }catch(err){
    entry.stage = 'err';
    entry.errMsg = '인식 실패: ' + err.message;
    renderChat();
  }
}

function blobToB64(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(blob);
  });
}

/* ================= 연속 통역 모드 ================= */
async function contStart(side){
  if (contMode) contStop(false);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (!(await ensureMic())) { alert(MIC_HELP); return; }
  if (!window.MediaRecorder) { alert('이 브라우저는 녹음을 지원하지 않습니다. Chrome/Safari로 열어주세요.'); return; }
  try{
    contAC = new (window.AudioContext || window.webkitAudioContext)();
    if (contAC.state === 'suspended') await contAC.resume();
    const src = contAC.createMediaStreamSource(mediaStream);
    contAnalyser = contAC.createAnalyser();
    contAnalyser.fftSize = 2048;
    src.connect(contAnalyser);
  }catch(e){ alert('오디오 분석을 시작할 수 없습니다: ' + e.message); return; }
  contMode = side;
  contPausedByTTS = false;
  setContUI(true);
  startContSegment();
  contTimer = setInterval(contTick, 60);
  toast('연속 통역 시작 — 다시 탭하면 종료');
}

function contStop(showToast){
  if (!contMode) return;
  const side = contMode;
  contMode = null;
  clearInterval(contTimer); contTimer = null;
  contDiscardNext = true;
  if (contRec && contRec.state === 'recording'){ try{ contRec.stop(); }catch(e){} }
  contRec = null; contChunks = [];
  if (contAC){ try{ contAC.close(); }catch(e){} contAC = null; contAnalyser = null; }
  setContUI(false, side);
  if (showToast) toast('연속 통역 종료');
}

let contDiscardNext = false;
function startContSegment(){
  if (!contMode || !mediaStream || !mediaStream.active) return;
  contChunks = [];
  contDiscardNext = false;
  const mime = pickMime();
  contRec = new MediaRecorder(mediaStream, mime ? { mimeType:mime } : undefined);
  contRec.ondataavailable = e => { if (e.data && e.data.size) contChunks.push(e.data); };
  contRec.onstop = () => onContSegStop();
  contRec.start();
  contSegStart = Date.now();
  contHadSpeech = false; contSpeaking = false; contSpeechStart = 0; contSilenceStart = 0;
}

function cutContSegment(process){
  if (!contRec || contRec.state !== 'recording') return;
  contDiscardNext = !process;
  try{ contRec.stop(); }catch(e){}
}

function onContSegStop(){
  const blob = new Blob(contChunks, { type: (contRec && contRec.mimeType) || 'audio/webm' });
  contChunks = [];
  const discard = contDiscardNext; contDiscardNext = false;
  if (!discard && contHadSpeech && blob.size > 1200 && contMode){
    processSpeech(contMode, blob, false);   // 인식 안 되면 조용히 무시 (토스트 없음)
  }
  /* 모드가 켜져 있고 TTS 대기 중이 아니면 다음 문장 녹음 계속 */
  if (contMode && !contPausedByTTS) startContSegment();
}

function contTick(){
  if (!contMode || !contAnalyser || contPausedByTTS) return;
  const buf = new Uint8Array(contAnalyser.fftSize);
  contAnalyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i=0;i<buf.length;i++){ const v = (buf[i]-128)/128; sum += v*v; }
  const rms = Math.sqrt(sum/buf.length);
  const now = Date.now();

  if (rms > CONT.THRESHOLD){
    if (!contSpeaking){ contSpeaking = true; contSpeechStart = now; }
    contSilenceStart = 0;
    if (now - contSpeechStart >= CONT.MIN_SPEECH_MS && !contHadSpeech){
      contHadSpeech = true;
      const pad = document.getElementById('pad-'+contMode); if (pad) pad.classList.add('talk');
    }
  } else {
    if (contSpeaking){ contSpeaking = false; contSilenceStart = now; }
    if (contHadSpeech && contSilenceStart && now - contSilenceStart >= CONT.SILENCE_MS){
      const pad = document.getElementById('pad-'+contMode); if (pad) pad.classList.remove('talk');
      cutContSegment(true);
      return;
    }
  }
  /* 말이 너무 길면 강제로 잘라 통역 */
  if (contHadSpeech && now - contSegStart >= CONT.MAX_SEG_MS){
    const pad = document.getElementById('pad-'+contMode); if (pad) pad.classList.remove('talk');
    cutContSegment(true);
    return;
  }
  /* 말 없이 오래 지나면 조용히 새 세그먼트로 교체 (파일 비대 방지) */
  if (!contHadSpeech && now - contSegStart >= 20000){
    cutContSegment(false);
  }
}

/* TTS 재생 중엔 마이크 입력 무시 — 통역 음성이 다시 인식되는 것 방지 */
function contPauseForTTS(){
  if (!contMode) return;
  contPausedByTTS = true;
  const pad = document.getElementById('pad-'+contMode); if (pad) pad.classList.remove('talk');
  cutContSegment(false);
}
function contResumeAfterTTS(){
  if (!contMode || !contPausedByTTS) return;
  if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) return;
  contPausedByTTS = false;
  if (!contRec || contRec.state !== 'recording') startContSegment();
}

function setContUI(on, sideOff){
  const side = on ? contMode : sideOff;
  const pad = document.getElementById('pad-'+side);
  const sub = document.getElementById('sub-'+side);
  if (!pad) return;
  pad.classList.toggle('cont', !!on);
  pad.classList.remove('talk');
  if (on){
    sub.textContent = '연속 통역 중 — 탭하면 종료';
  } else {
    sub.textContent = side === 'ko' ? '꾹: 한 마디 · 탭: 연속' : LANGS[curLang].idle;
  }
}

/* pointer 바인딩 — 누르는 동안 녹음, 떼면 인식 */
[['ko','pad-ko'],['tg','pad-tg'],['radio','pad-radio']].forEach(([side,id])=>{
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', e => { try{btn.setPointerCapture(e.pointerId);}catch(_){} pttStart(side, e); });
  btn.addEventListener('pointerup',     e => pttEnd(side, e));
  btn.addEventListener('pointercancel', e => pttEnd(side, e));
  btn.addEventListener('contextmenu',   e => e.preventDefault());
});

function setPadUI(side, on){
  const pad = document.getElementById('pad-'+side);
  const sub = document.getElementById('sub-'+side);
  pad.classList.toggle('rec', on);
  if (side === 'radio') sub.textContent = on ? '송신 중 — 떼면 전송' : (radioName ? radioName + ' — 꾹 누르면 Slack으로' : '꾹 누르면 음성이 Slack으로');
  else if (side === 'ko') sub.textContent = on ? '듣는 중 — 떼면 통역' : '꾹: 한 마디 · 탭: 연속';
  else sub.textContent = on ? '● REC' : LANGS[curLang].idle;
}

/* ================= 번역 ================= */
async function translateEntry(entry){
  const cfg = LANGS[entry.lang];
  const isKo = entry.side === 'ko';
  const srcLang = isKo ? 'Korean' : cfg.eng;
  const tgtLang = isKo ? cfg.eng : 'Korean';
  const text = isKo ? entry.ko : entry.tgt;

  const prompt =
`You are a medical interpreter at a Korean medicine clinic. Translate the user text from ${srcLang} to ${tgtLang}.
STRICT RULES:
- Literal, faithful translation only. Do NOT paraphrase, summarize, localize, or improve.
- Do NOT add, omit, explain, or answer anything. If the text is a question, translate the question (do not answer it).
- Preserve numbers, units, dosage, body parts, and medical terms exactly.
- Keep the same sentence structure and tone as closely as the target language allows.
- Output ONLY the translation. No quotes, no notes, no labels.

TEXT:
${text}`;

  try{
    const res = await fetch(PROXY_URL, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({
        model: useOpus ? 'claude-opus-4-8' : 'claude-haiku-4-5-20251001',
        max_tokens: 400, prompt
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(typeof data.error==='string' ? data.error : (data.error.message||'error'));
    const out = (data.content && data.content[0] && data.content[0].text || '').trim();
    if (isKo) entry.tgt = out; else entry.ko = out;
    entry.stage = 'done';
    renderChat();
    if (autoSpeak && out) speakAuto(out, isKo ? cfg.code : 'ko-KR');
    if (slackLog) postSlack(entry);
  }catch(err){
    entry.stage = 'err'; entry.errMsg = '번역 실패: ' + err.message;
    renderChat();
  }
}

function postSlack(entry){
  const cfg = LANGS[entry.lang];
  const msg = `🇰🇷 ${entry.ko || '-'}\n${cfg.flag} ${entry.tgt || '-'}`;
  fetch(PROXY_URL, {
    method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'slack', text: msg })
  }).catch(()=>{});
}

/* ================= 텍스트 입력 ================= */
function sendFromTa(){
  const ta = document.getElementById('ta');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  const isKorean = /[\uAC00-\uD7A3]/.test(text);
  const entry = { id: Date.now(), lang: curLang, side: isKorean ? 'ko' : 'tg', stage:'tr' };
  if (isKorean) entry.ko = text; else entry.tgt = text;
  history.push(entry); renderChat();
  translateEntry(entry);
}
function taKey(e){ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendFromTa(); } }

/* ================= 음성 출력 ================= */
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
const FEMALE_HINTS = ['female','woman','girl','kyoko','o-ren','siri female','google 日本語','google us english','google 中文','samantha','victoria','zira','nuan','mei','ting','tessa','amira','kanya','google ภาษาไทย','premwadee','ava','jenny','sora','yuna','heami','sun-hi'];
const MALE_HINTS = ['male','man','google uk english male','daniel','alex','fred','otoya','kenji','ichiro'];
function pickVoice(code){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if (!vs.length) return null;
  const base = code.split('-')[0].toLowerCase();
  const same = vs.filter(v => (v.lang||'').toLowerCase().startsWith(base));
  const pool = same.length ? same : vs;
  const isF = v => FEMALE_HINTS.some(h => (v.name||'').toLowerCase().includes(h));
  const isM = v => MALE_HINTS.some(h => (v.name||'').toLowerCase().includes(h));
  return pool.find(isF) || pool.find(v=>!isM(v)) || pool[0];
}
function applyVoice(u, code){ const v = pickVoice(code); if (v) u.voice = v; u.lang = code; u.rate = .95; u.pitch = 1.1; }
function speakAuto(text, code){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  contPauseForTTS();
  const u = new SpeechSynthesisUtterance(text);
  applyVoice(u, code);
  u.onend = u.onerror = ()=>{ setTimeout(contResumeAfterTTS, 350); };
  speechSynthesis.speak(u);
}
function speakBtn(text, code, id){
  if (!window.speechSynthesis) return;
  if (ttsId === id){ speechSynthesis.cancel(); ttsId=null; document.querySelectorAll('.spk').forEach(b=>b.classList.remove('on')); setTimeout(contResumeAfterTTS, 350); return; }
  speechSynthesis.cancel();
  contPauseForTTS();
  document.querySelectorAll('.spk').forEach(b=>b.classList.remove('on'));
  const btn = document.getElementById(id);
  if (btn) btn.classList.add('on');
  ttsId = id;
  const u = new SpeechSynthesisUtterance(text);
  applyVoice(u, code);
  u.onend = u.onerror = ()=>{ ttsId=null; if (btn) btn.classList.remove('on'); setTimeout(contResumeAfterTTS, 350); };
  speechSynthesis.speak(u);
}

/* ================= 렌더 ================= */
function renderChat(){
  const chat = document.getElementById('chat');
  const cfg = LANGS[curLang];
  if (!history.length){
    chat.innerHTML = `<div class="empty">
      <div class="mark">🎙</div>
      <div class="t1 serif"><b>꾹 누른 채</b> 말하면 한 마디 통역<br><b>짧게 탭</b>하면 연속 통역이 켜집니다</div>
      <div class="t2"><span style="color:var(--doc);font-weight:800">한국어</span> — 원장&nbsp;&nbsp;·&nbsp;&nbsp;<span style="color:var(--pat);font-weight:800">${cfg.flag} ${cfg.name}</span> — 환자</div>
    </div>`;
    return;
  }
  chat.innerHTML = '';
  history.forEach((h, i)=>{
    const cfg2 = LANGS[h.lang];
    const g = document.createElement('div'); g.className = 'grp';
    const dots = '<span class="dots"><i></i><i></i><i></i></span>';

    /* 무전 칩 (중앙) */
    if (h.side === 'radio'){
      if (h.stage === 'stt')
        g.innerHTML = `<div class="chiprow"><div class="chip"><span class="cico">📻</span>받아쓰는 중 ${dots}</div></div>`;
      else if (h.stage === 'err')
        g.innerHTML = `<div class="chiprow"><div class="chip fail"><span class="cico">📻</span>${esc(h.errMsg||'무전 실패')}</div></div>`;
      else
        g.innerHTML = `<div class="chiprow"><div class="chip sent"><span class="cico">📻</span>${esc(h.radioText)}&nbsp;·&nbsp;전송됨</div></div>`;
      chat.appendChild(g); return;
    }

    if (h.stage === 'err'){
      const side = h.side==='ko' ? 'L' : 'R';
      g.innerHTML = `<div class="row ${side}"><div class="bub b-err">${esc(h.errMsg||'오류')}</div></div>`;
      chat.appendChild(g); return;
    }
    /* 한국어 줄 (좌) */
    if (h.ko){
      const id = `sk${i}`;
      g.innerHTML += `<div class="row L"><div class="bub b-ko">${esc(h.ko)}</div><button class="spk" id="${id}" onclick="speakBtn('${ea(h.ko)}','ko-KR','${id}')">🔊</button></div>`;
    } else if (h.side==='ko' && h.stage==='stt'){
      g.innerHTML += `<div class="row L"><div class="bub b-wait">받아쓰는 중 ${dots}</div></div>`;
    } else if (h.stage==='tr'){
      g.innerHTML += `<div class="row L"><div class="bub b-wait">통역 중 ${dots}</div></div>`;
    }
    /* 외국어 줄 (우) */
    if (h.tgt){
      const id = `st${i}`;
      g.innerHTML += `<div class="row R"><button class="spk" id="${id}" onclick="speakBtn('${ea(h.tgt)}','${cfg2.code}','${id}')">🔊</button><div class="bub b-tg">${esc(h.tgt)}</div></div>`;
    } else if (h.side==='tg' && h.stage==='stt'){
      g.innerHTML += `<div class="row R"><div class="bub b-wait">${dots}</div></div>`;
    } else if (h.stage==='tr'){
      g.innerHTML += `<div class="row R"><div class="bub b-wait">${dots}</div></div>`;
    }
    chat.appendChild(g);
  });
  chat.scrollTop = chat.scrollHeight;
}

/* ================= 언어/설정 ================= */
function buildLangs(){
  const box = document.getElementById('langs');
  box.innerHTML = '';
  Object.entries(LANGS).forEach(([key,v])=>{
    const b = document.createElement('button');
    b.className = 'lang' + (key===curLang?' active':'');
    b.innerHTML = `<span class="fl">${v.flag}</span>${v.name}`;
    b.onclick = ()=>switchLang(key);
    box.appendChild(b);
  });
}
function switchLang(key){
  contStop(false);
  curLang = key;
  buildLangs();
  document.getElementById('name-tg').textContent = LANGS[key].name;
  document.getElementById('sub-tg').textContent = LANGS[key].idle;
  renderChat();
}
function toggleSettings(){ document.getElementById('settings').classList.toggle('open'); }

/* ---------- 발신자 이름 ---------- */
function openNameModal(){
  const inp = document.getElementById('nameInput');
  inp.value = radioName;
  document.getElementById('nameVeil').classList.add('open');
  setTimeout(()=>inp.focus(), 50);
}
function saveName(){
  const v = document.getElementById('nameInput').value.trim();
  if (!v){ toast('이름을 입력해주세요'); return; }
  radioName = v;
  try { localStorage.setItem('acro_radio_name', v); } catch(e){}
  document.getElementById('nameVeil').classList.remove('open');
  updateRadioLabel();
  toast(v + ' — 설정 완료');
}
function updateRadioLabel(){
  document.getElementById('sub-radio').textContent =
    radioName ? radioName + ' — 꾹 누르면 Slack으로' : '꾹 누르면 음성이 Slack으로';
}
function clearAll(){
  if (!confirm('대화 내용을 모두 삭제할까요?')) return;
  contStop(false);
  window.speechSynthesis && speechSynthesis.cancel();
  history = []; renderChat();
}

/* ================= util ================= */
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function ea(t){ return t.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' '); }
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

buildLangs();
renderChat();
updateRadioLabel();
</script>
