ko: '<h1>교정장치 관리법과 주의사항</h1><p class="lead">오늘 받으신 치료의 효과를 오래 지키는 방법입니다.</p>'+
'<h2><span class="num">01</span>착용법</h2><div class="card"><ul class="cln"><li><b>오래 착용할수록 좋습니다.</b> 기본은 <b>주무실 때 착용</b>입니다.</li><li>낮에도 장치를 물고 <b>스트레칭·가벼운 운동</b>을 하시면 더 좋습니다.</li><li>초기 며칠은 침 분비·이물감이 있을 수 있습니다 — 자연스러운 적응 과정입니다.</li><li>아기 젖병과 같은 성분의 안전한 소재입니다.</li></ul></div>'+

'<h2><span class="num">02</span>세척과 보관</h2><div class="card"><ul class="cln"><li>사용 후 <b>흐르는 미온수</b> + 부드러운 칫솔로 세척. <b>치약 사용 금지</b>(흠집→세균 번식).</li><li>주 1~2회 전용 세정제로 소독.</li><li>물기 말린 뒤 <b>전용 케이스</b> 보관. 휴지에 싸두면 분실 1순위.</li></ul>'+

'<div class="callout"><div class="ct">열탕·전자레인지 소독도 가능합니다</div>젖병과 같은 소재라 끓는 물에 삶아 소독하거나 전자레인지 소독기 사용도 가능합니다. 분실·파손 시 재제작(150,000원)이 필요하니 케이스 보관만 꼭 지켜주세요.</div>'+

'<div class="callout">치료 당일 뻐근함·멍은 1~2일 내 사라집니다. 당일 과격한 운동·음주·사우나는 피해 주세요.</div>'+

en: '<h1>Appliance Care & Aftercare</h1><p class="lead">How to keep today\'s result for longer.</p>'+
'<h2><span class="num">01</span>How to wear</h2><div class="card"><ul class="cln"><li><b>The longer you wear it, the better.</b> Baseline: <b>wear it while sleeping.</b></li><li>In the daytime, bite the appliance during <b>stretching or light exercise</b> — this also helps.</li><li>Extra saliva or a foreign-body feeling in the first days is a normal adaptation.</li><li>It is made of the same safe material as baby bottles.</li></ul></div>'+
'<div class="callout red"><div class="ct">Stop wearing and contact us if…</div>you feel jaw/tooth pain while wearing it, or your bite feels off in the morning repeatedly. Do not push through — contact us first.</div>'+
'<h2><span class="num">02</span>Cleaning & storage</h2><div class="card"><ul class="cln"><li>Rinse under <b>lukewarm running water</b> with a soft toothbrush. <b>No toothpaste</b> (abrasives scratch the surface).</li><li>Disinfect 1–2×/week with a denture/appliance cleanser.</li><li>Dry and keep it in <b>its case</b> — wrapping it in tissue is the #1 cause of loss.</li></ul>'+
'<a class="vid" href="https://www.youtube.com/watch?v=VGY9miP2XYk">▶ <span>Watch</span> — How to clean the oral appliance (1 min)</a></div>'+
'<div class="callout"><div class="ct">Boiling and microwave sterilization are fine</div>Made of the same material as baby bottles, it can be boiled or sterilized in a microwave sterilizer. Just keep it in its case — replacement after loss or damage is ₩150,000.</div>'+
'<h2><span class="num">03</span>Habits that protect your result</h2><div class="card"><ul class="cln red"><li><b>Do not chew on one side only</b> — the most important rule.</li><li>No chin-resting, no clenching.</li><li>Reduce tough, chewy foods during treatment.</li><li>Avoid sleeping on one side only — sleep on your back if possible.</li><li>Reduce prolonged head-down phone posture.</li></ul></div>'+
'<div class="callout">Mild soreness or bruising on the treatment day usually resolves in 1–2 days. Avoid intense exercise, alcohol and sauna on the day.</div>'+
'<h2><span class="num">04</span>Next visits</h2><div class="card"><ul class="cln"><li>First 2 weeks <b>2×/week</b> → next 4 weeks <b>1×/week</b>. Long gaps break the effect.</li><li>We take standardized photos every visit to track your change.</li><li>Living abroad? Keep wearing the appliance after you return home, and contact us anytime via KakaoTalk, LINE or WhatsApp.</li></ul></div>',
it: '<h1>Cura del bite e indicazioni post-trattamento</h1><p class="lead">Come conservare più a lungo il risultato di oggi.</p>'+
'<h2><span class="num">01</span>Come indossarlo</h2><div class="card"><ul class="cln"><li><b>Più a lungo lo indossa, meglio è.</b> Base: <b>durante il sonno.</b></li><li>Di giorno, lo tenga in bocca durante <b>stretching o attività leggera</b>: aiuta.</li><li>Nei primi giorni salivazione o sensazione di corpo estraneo sono un normale adattamento.</li><li>È fatto dello stesso materiale sicuro dei biberon.</li></ul></div>'+
'<div class="callout red"><div class="ct">Sospenda l\'uso e ci contatti se…</div>sente dolore a mandibola o denti durante l\'uso, o al mattino l\'occlusione sembra ripetutamente alterata. Non insista: ci contatti prima.</div>'+
'<h2><span class="num">02</span>Pulizia e conservazione</h2><div class="card"><ul class="cln"><li>Dopo l\'uso, risciacqui con <b>acqua tiepida corrente</b> e spazzolino morbido. <b>Niente dentifricio</b> (gli abrasivi graffiano la superficie).</li><li>Disinfetti 1–2 volte a settimana con detergente per protesi/apparecchi.</li><li>Asciughi e conservi <b>nella custodia</b>: avvolgerlo nei fazzoletti è la prima causa di smarrimento.</li></ul>'+
'<a class="vid" href="https://www.youtube.com/watch?v=VGY9miP2XYk">▶ <span>Video</span> — Pulizia dell\'apparecchio orale (1 min)</a></div>'+
'<div class="callout"><div class="ct">Sterilizzabile in acqua bollente o al microonde</div>Essendo dello stesso materiale dei biberon, può essere bollito o sterilizzato al microonde. Lo conservi sempre nella custodia: la sostituzione in caso di smarrimento o danno costa ₩150.000.</div>'+
'<h2><span class="num">03</span>Abitudini che proteggono il risultato</h2><div class="card"><ul class="cln red"><li><b>Non masticare da un solo lato</b> — la regola più importante.</li><li>Non appoggiare il mento, non stringere i denti.</li><li>Ridurre i cibi duri e gommosi durante il trattamento.</li><li>Evitare di dormire sempre sullo stesso fianco — meglio supini.</li><li>Ridurre la postura a capo chino sullo smartphone.</li></ul></div>'+
'<div class="callout">Lieve indolenzimento o lividi il giorno del trattamento si risolvono in 1–2 giorni. Eviti sport intenso, alcol e sauna in giornata.</div>'+
'<h2><span class="num">04</span>Prossime visite</h2><div class="card"><ul class="cln"><li>Prime 2 settimane <b>2×/settimana</b> → poi 4 settimane <b>1×/settimana</b>. Pause lunghe interrompono l\'effetto.</li><li>Ad ogni visita foto standardizzate per documentare il cambiamento.</li><li>Vive all\'estero? Continui a usare il bite dopo il rientro e ci scriva quando vuole su KakaoTalk, LINE o WhatsApp.</li></ul></div>',
ja: '<h1>矯正装置の管理方法と注意事項</h1><p class="lead">本日の治療効果を長く保つ方法です。</p>'+
'<h2><span class="num">01</span>装着方法</h2><div class="card"><ul class="cln"><li><b>長く着けるほど良いです。</b>基本は<b>就寝時の装着</b>です。</li><li>日中も装置を噛みながら<b>ストレッチや軽い運動</b>をするとさらに効果的です。</li><li>初めの数日は唾液が増えたり違和感があったりしますが、自然な適応過程です。</li><li>哺乳瓶と同じ成分の安全な素材です。</li></ul></div>'+
'<div class="callout red"><div class="ct">装着を中止してご連絡ください</div>装着中に顎や歯の痛みが出る、朝の噛み合わせの違和感が続く場合は、無理せずまずご連絡ください。</div>'+
'<h2><span class="num">02</span>洗浄と保管</h2><div class="card"><ul class="cln"><li>使用後は<b>ぬるま湯の流水</b>+やわらかい歯ブラシで洗浄。<b>歯磨き粉は使用禁止</b>(研磨剤で傷→細菌繁殖)。</li><li>週1~2回、入れ歯・口腔装置用洗浄剤で消毒。</li><li>水気を切って<b>専用ケース</b>で保管。ティッシュに包むのは紛失原因の第1位です。</li></ul>'+
'<a class="vid" href="https://www.youtube.com/watch?v=VGY9miP2XYk">▶ <span>動画で見る</span> — 口腔装置の洗浄・消毒法 (1分)</a></div>'+
'<div class="callout"><div class="ct">煮沸・電子レンジ消毒もOK</div>哺乳瓶と同じ素材のため、煮沸消毒や電子レンジ消毒も可能です。紛失・破損時は再作製(₩150,000)が必要になるため、ケース保管だけは必ずお守りください。</div>'+
'<h2><span class="num">03</span>効果を守る生活習慣</h2><div class="card"><ul class="cln red"><li><b>片側だけで噛まない</b> — 最も重要です。</li><li>頬杖をつかない・食いしばらない。</li><li>硬い・弾力のある食べ物は治療期間中控えめに。</li><li>片側だけを下にして寝ない — できれば仰向けで。</li><li>スマホのうつむき姿勢を減らす。</li></ul></div>'+
'<div class="callout">治療当日の軽いだるさ・あざは1~2日で消えます。当日の激しい運動・飲酒・サウナはお控えください。</div>'+
'<h2><span class="num">04</span>次回のご来院</h2><div class="card"><ul class="cln"><li>最初の2週間は<b>週2回</b> → その後4週間は<b>週1回</b>。間隔が空くと効果が途切れます。</li><li>毎回同一条件の写真で変化を記録します。</li><li>海外にお住まいの方: 帰国後も装置の装着を続け、LINE・カカオトーク・WhatsAppでいつでもご相談ください。</li></ul></div>',
zhCN: '<h1>矫正器护理方法与注意事项</h1><p class="lead">让今天的治疗效果保持更久的方法。</p>'+
'<h2><span class="num">01</span>佩戴方法</h2><div class="card"><ul class="cln"><li><b>戴得越久越好。</b>基础是<b>睡觉时佩戴</b>。</li><li>白天也可以咬着矫正器做<b>拉伸或轻度运动</b>,效果更好。</li><li>最初几天口水增多、有异物感是正常的适应过程。</li><li>材质与婴儿奶瓶相同,安全放心。</li></ul></div>'+
'<div class="callout red"><div class="ct">出现以下情况请停止佩戴并联系我们</div>佩戴中出现下颌或牙齿疼痛,或早晨咬合持续感觉不对。请不要勉强,先联系我们。</div>'+
'<h2><span class="num">02</span>清洁与保管</h2><div class="card"><ul class="cln"><li>使用后用<b>流动温水</b>+软毛牙刷轻刷。<b>禁用牙膏</b>(研磨剂会划伤表面滋生细菌)。</li><li>每周1~2次用假牙/口腔矫正器专用清洁剂消毒。</li><li>晾干后放入<b>专用盒</b>保管。用纸巾包着是丢失的头号原因。</li></ul>'+
'<a class="vid" href="https://www.youtube.com/watch?v=VGY9miP2XYk">▶ <span>观看视频</span> — 口腔矫正器清洁消毒法 (1分钟)</a></div>'+
'<div class="callout"><div class="ct">可以水煮·微波炉消毒</div>与婴儿奶瓶相同的材质,可煮沸消毒,也可使用微波炉消毒器。丢失或损坏需重做(₩150,000),请务必放入专用盒保管。</div>'+
'<h2><span class="num">03</span>保护效果的生活习惯</h2><div class="card"><ul class="cln red"><li><b>不要只用一边咀嚼</b> — 最重要。</li><li>不托腮、不紧咬牙。</li><li>治疗期间少吃硬、韧的食物。</li><li>不要总朝同一侧侧睡 — 尽量仰卧。</li><li>减少长时间低头看手机。</li></ul></div>'+
'<div class="callout">治疗当天的轻微酸胀、瘀青一般1~2天消退。当天请避免剧烈运动、饮酒、桑拿。</div>'+
'<h2><span class="num">04</span>下次就诊</h2><div class="card"><ul class="cln"><li>前2周<b>每周2次</b> → 之后4周<b>每周1次</b>。间隔太久效果会中断。</li><li>每次以同一条件拍照记录变化。</li><li>海外居住者: 回国后请继续佩戴矫正器,随时通过KakaoTalk、LINE或WhatsApp联系我们。</li></ul></div>',
zhTW: '<h1>矯正器照護方法與注意事項</h1><p class="lead">讓今天的治療效果維持更久的方法。</p>'+

th: '<h1>วิธีดูแลเครื่องมือและข้อควรระวัง</h1><p class="lead">วิธีรักษาผลของการรักษาวันนี้ให้อยู่นานขึ้น</p>'+
'<h2><span class="num">01</span>วิธีใส่</h2><div class="card"><ul class="cln"><li><b>ยิ่งใส่นานยิ่งดี</b> พื้นฐานคือ<b>ใส่ตอนนอน</b></li><li>กลางวันกัดเครื่องมือขณะ<b>ยืดเหยียดหรือออกกำลังเบา ๆ</b> ก็ช่วยเพิ่มผล</li><li>ช่วงแรกอาจมีน้ำลายมากหรือรู้สึกแปลก ๆ เป็นการปรับตัวตามปกติ</li><li>ทำจากวัสดุปลอดภัยชนิดเดียวกับขวดนมเด็ก</li></ul></div>'+
'<div class="callout red"><div class="ct">หยุดใส่และติดต่อเราเมื่อ…</div>มีอาการปวดขากรรไกร/ฟันขณะใส่ หรือตื่นเช้าแล้วรู้สึกว่าการสบฟันผิดปกติต่อเนื่อง อย่าฝืน ติดต่อเราก่อน</div>'+
'<h2><span class="num">02</span>การทำความสะอาดและเก็บรักษา</h2><div class="card"><ul class="cln"><li>หลังใช้ ล้างด้วย<b>น้ำอุ่นไหล</b> + แปรงขนนุ่ม <b>ห้ามใช้ยาสีฟัน</b> (สารขัดทำให้เป็นรอย→เชื้อสะสม)</li><li>สัปดาห์ละ 1–2 ครั้ง แช่เม็ดฟู่ทำความสะอาดฟันปลอม/เครื่องมือ</li><li>เช็ดแห้งแล้วเก็บใน<b>กล่องเฉพาะ</b> — ห่อทิชชู่คือสาเหตุอันดับ 1 ของการทำหาย</li></ul>'+
'<a class="vid" href="https://www.youtube.com/watch?v=VGY9miP2XYk">▶ <span>ดูวิดีโอ</span> — วิธีทำความสะอาดเครื่องมือในช่องปาก (1 นาที)</a></div>'+
'<div class="callout"><div class="ct">ต้มฆ่าเชื้อหรือใช้ไมโครเวฟได้</div>เพราะเป็นวัสดุเดียวกับขวดนมเด็ก จึงต้มฆ่าเชื้อหรือใช้เครื่องนึ่งไมโครเวฟได้ หากสูญหายหรือเสียหายต้องทำใหม่ (₩150,000) กรุณาเก็บในกล่องทุกครั้ง</div>'+
'<h2><span class="num">03</span>นิสัยที่ช่วยรักษาผลลัพธ์</h2><div class="card"><ul class="cln red"><li><b>อย่าเคี้ยวข้างเดียว</b> — สำคัญที่สุด</li><li>ไม่เท้าคาง ไม่ขบฟัน</li><li>ลดอาหารแข็ง/เหนียวระหว่างการรักษา</li><li>อย่านอนตะแคงข้างเดิมตลอด — นอนหงายถ้าทำได้</li><li>ลดการก้มหน้าดูมือถือนาน ๆ</li></ul></div>'+
'<div class="callout">อาการตึงหรือรอยช้ำเล็กน้อยในวันรักษาจะหายใน 1–2 วัน วันนั้นงดออกกำลังหนัก แอลกอฮอล์ และซาวน่า</div>'+
'<h2><span class="num">04</span>นัดครั้งต่อไป</h2><div class="card"><ul class="cln"><li>2 สัปดาห์แรก<b>สัปดาห์ละ 2 ครั้ง</b> → 4 สัปดาห์ถัดไป<b>สัปดาห์ละ 1 ครั้ง</b> เว้นนานผลจะขาดตอน</li><li>ถ่ายรูปเงื่อนไขเดิมทุกครั้งเพื่อบันทึกการเปลี่ยนแปลง</li><li>อยู่ต่างประเทศ: กลับบ้านแล้วใส่เครื่องมือต่อ และติดต่อเราได้ทุกเมื่อทาง LINE, KakaoTalk หรือ WhatsApp</li></ul></div>'
}; })();
var LANGS=[{code:"ko",label:"한국어"},{code:"en",label:"English"},{code:"it",label:"Italiano"},{code:"ja",label:"日本語"},{code:"zhCN",label:"简体中文"},{code:"zhTW",label:"繁體中文"},{code:"th",label:"ไทย"}];
var cur="ko";
function koRefs(sel){var d=document.createElement("div");d.innerHTML=AFTER.ko;return Array.prototype.map.call(d.querySelectorAll(sel),function(e){return e.textContent.trim();});}
function render(){
  var root=document.getElementById("afterRoot");
  root.innerHTML=AFTER[cur];
  if(cur!=="ko"){
    ["h1","h2",".ct"].forEach(function(sel){
      var ko=koRefs(sel), els=root.querySelectorAll(sel);
      Array.prototype.forEach.call(els,function(e,i){ if(ko[i]){var g=document.createElement("span");g.className="ko-gloss";g.textContent=ko[i];e.appendChild(g);} });
    });
  }
  document.documentElement.lang = (cur==="zhCN"?"zh-CN":cur==="zhTW"?"zh-TW":cur);
}
function buildBar(){
  var b=document.getElementById("langBar"); b.innerHTML="";
  LANGS.forEach(function(l){ var btn=document.createElement("button"); btn.textContent=l.label;
    if(l.code===cur)btn.className="on";
    btn.onclick=function(){cur=l.code;buildBar();render();window.scrollTo(0,0);}; b.appendChild(btn); });
}
buildBar(); render();
</script>
</body>
</html>
