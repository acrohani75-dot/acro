<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아크로 포토인박스 v1_6</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --acc:#4fc3f7; --ok:#66bb6a; --warn:#ffa726; --bad:#ef5350; --tx:#e8eaf0; --dim:#8b93a3; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:16px; }
  h1 { font-size:17px; padding:4px 0 12px; }
  h1 small { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { font-size:11.5px; color:var(--dim); display:flex; flex-direction:column; gap:4px; }
  input, select { background:#242a36; border:1px solid #313949; border-radius:8px; color:var(--tx); padding:11px 8px; font-size:15px; width:100%; }
  input:focus, select:focus { outline:none; border-color:var(--acc); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .chartRow { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; }
  .chartRow button { background:#2b3342; color:var(--acc); border:1px solid #3a4152; border-radius:8px; padding:11px 14px; font-size:13px; font-weight:700; }
  #nameState { font-size:11.5px; margin-top:6px; min-height:14px; }
  .btn { border:0; border-radius:11px; padding:15px; font-size:15px; font-weight:700; color:#fff; width:100%; }
  .btn:active { transform:scale(.97); }
  .missing { border-color:var(--bad) !important; }
  #btnCam, #btnGal { background:#2b3342; color:var(--tx); border:1px dashed #4a5468; }
  #camModal { display:none; position:fixed; inset:0; background:#000; z-index:9999; }
  #camView { width:100%; height:100%; object-fit:cover; }
  #camTop { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:14px; }
  #camCnt { background:rgba(0,0,0,.55); color:#fff; border-radius:10px; padding:8px 14px; font-size:15px; font-weight:700; }
  #camClose { background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-size:15px; }
  #camBottom { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-around; padding:26px 20px calc(26px + env(safe-area-inset-bottom)); }
  #camShut { width:74px; height:74px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.4); }
  #camShut:active { transform:scale(.92); }
  #camDone { background:var(--ok); color:#063312; border:0; border-radius:12px; padding:14px 22px; font-size:16px; font-weight:800; }
  #camFlip { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:50%; width:52px; height:52px; font-size:20px; }
  #camFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .12s; }
  #btnUp { background:var(--acc); color:#06222f; margin-top:8px; display:none; }
  #thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .th { position:relative; }
  .th img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:7px; }
  .th .x { position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border:0; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; }
  .th .st { position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,.6); border-radius:5px; font-size:10px; padding:2px 5px; }
  #prog { height:8px; background:#242a36; border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  #progBar { height:100%; width:0%; background:var(--ok); transition:width .2s; }
  #result { font-size:13px; line-height:1.6; margin-top:10px; }
  #result a { color:var(--acc); }
  .foot { color:var(--dim); font-size:11px; text-align:center; padding:8px 0 20px; }
  .grp { font-size:12px; color:var(--dim); margin:12px 0 6px; }
  .hint { font-size:11px; color:var(--dim); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { background:#242a36; color:var(--tx); border:1px solid #313949; border-radius:16px; padding:9px 14px; font-size:13.5px; }
  .chips button.on { border-color:var(--acc); color:var(--acc); font-weight:700; }
  .stepRow { display:grid; grid-template-columns:44px 1fr 44px; gap:6px; }
  .step { background:#2b3342; color:var(--tx); border:1px solid #3a4152; border-radius:8px; font-size:18px; font-weight:700; }
  .tgl { flex-direction:row !important; align-items:center; gap:8px; font-size:13px; color:var(--tx); margin-top:12px; display:flex; }
  .tgl input { width:auto; accent-color:var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <h1>아크로 포토인박스 <small>v1_6 · 전후사진 자동 저장</small></h1>

  <div class="card">
    <div class="row2" style="margin-top:0">
      <label>차트번호<input id="fChart" type="tel" inputmode="numeric" placeholder="예: 17136" maxlength="8"></label>
      <label>이름<input id="fName" type="text" placeholder="예: 김민주"></label>
    </div>
    <div id="nameState"></div>
    <label style="margin-top:8px">날짜<input id="fDate" type="date"></label>

    <div class="grp">시술 <span class="hint">(여러 개 선택 가능)</span></div>
    <div id="treatChips" class="chips"></div>
    <input id="fTreatCustom" type="text" placeholder="시술 직접입력 (선택)">

    <div class="grp">부위</div>
    <div id="partChips" class="chips"></div>
    <input id="fPartCustom" type="text" placeholder="부위 직접입력 (선택)" style="display:none">

    <div class="row2" style="align-items:end">
      <label>시점<select id="fTiming"></select></label>
      <label>회차<div class="stepRow">
        <button type="button" class="step" id="rMinus">−</button>
        <input id="fRound" type="tel" inputmode="numeric" value="1" style="text-align:center">
        <button type="button" class="step" id="rPlus">＋</button>
      </div></label>
    </div>
    <input id="fTimingCustom" type="text" placeholder="시점 직접입력 (예: 2달후)" style="display:none; margin-top:8px">
    <div id="roundHint" class="hint" style="margin-top:6px"></div>

    <label class="tgl"><input id="fConsent" type="checkbox" checked> 활용동의 환자 (해제 시 '활용동의안함' 폴더로 저장)</label>
  </div>

  <div class="card">
    <div class="row2" style="margin-top:0">
      <button class="btn" id="btnCam" type="button">📷 촬영 (연속)</button>
      <button class="btn" id="btnGal" type="button">🖼️ 갤러리</button>
    </div>
    <input id="fFilesCam" type="file" accept="image/*" capture="environment" hidden>
    <input id="fFilesGal" type="file" accept="image/*" multiple hidden>
    <div id="thumbs"></div>
    <div id="prog"><div id="progBar"></div></div>
    <button class="btn" id="btnUp" type="button">업로드</button>
    <div id="result"></div>
  </div>

  <div class="foot">사진은 폰에 남지 않고 Drive → 원내 공유폴더로 자동 정리됩니다</div>
</div>

<div id="camModal">
  <video id="camView" playsinline autoplay muted></video>
  <div id="camFlash"></div>
  <div id="camTop">
    <div id="camCnt">0장</div>
    <button id="camClose" type="button">✕ 닫기</button>
  </div>
  <div id="camBottom">
    <button id="camFlip" type="button">🔄</button>
    <button id="camShut" type="button" aria-label="촬영"></button>
    <button id="camDone" type="button">완료</button>
  </div>
</div>

<script>
"use strict";
// ── 설정: 배포 후 GAS 웹앱 URL을 여기 1곳만 교체 ──
var GAS_URL = "https://script.google.com/macros/s/AKfycbypKSEXsX0IzNm-GvPPBtK4b7pMTHdvyPpWVB9PQEh2XZrnFAw-JRi-_2es2bnzGnDaow/exec";
var TREATMENTS = ["온다", "웨이브", "컷"];
var BODY_PARTS = ["안면", "복부", "위팔", "허벅지", "종아리", "전신", "직접입력"];
var TIMINGS = ["시술전", "시술후", "직접입력"];
var MAX_EDGE = 2000, JPEG_Q = 0.88;

var photos = []; // {b64, mime, status, el}
var selTreats = {}, selPart = null;
var $ = function (id) { return document.getElementById(id); };

function renderChips(elId, list, multi, onPick) {
  var box = $(elId); box.innerHTML = "";
  list.forEach(function (v) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = v;
    b.onclick = function () { onPick(v, b); };
    box.appendChild(b);
  });
}

(function init() {
  var d = new Date();
  $("fDate").value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  renderChips("treatChips", TREATMENTS, true, function (v, b) {
    selTreats[v] = !selTreats[v];
    b.classList.toggle("on", selTreats[v]);
    refreshRound();
  });
  renderChips("partChips", BODY_PARTS, false, function (v, b) {
    selPart = v;
    Array.prototype.forEach.call($("partChips").children, function (x) { x.classList.toggle("on", x === b); });
    $("fPartCustom").style.display = v === "직접입력" ? "block" : "none";
    refreshRound();
  });
  TIMINGS.forEach(function (t) { var o = document.createElement("option"); o.textContent = t; $("fTiming").appendChild(o); });
  $("fTiming").onchange = function () {
    $("fTimingCustom").style.display = this.value === "직접입력" ? "block" : "none";
  };
  $("rMinus").onclick = function () { $("fRound").value = Math.max(1, (Number($("fRound").value) || 1) - 1); };
  $("rPlus").onclick = function () { $("fRound").value = (Number($("fRound").value) || 0) + 1; };
})();

function getTreatment() {
  var arr = TREATMENTS.filter(function (t) { return selTreats[t]; });
  var custom = $("fTreatCustom").value.trim();
  if (custom) arr.push(custom);
  return arr.join("+");
}
function getPart() {
  if (selPart === "직접입력") return $("fPartCustom").value.trim();
  return selPart || "";
}
function getTiming() {
  var v = $("fTiming").value;
  return v === "직접입력" ? $("fTimingCustom").value.trim() : v;
}

/** 차트+시술+부위가 갖춰지면 서버에서 회차 자동 제안 */
function refreshRound() {
  var chart = $("fChart").value.trim(), tr = getTreatment(), pt = getPart();
  if (!/^\d{1,8}$/.test(chart) || !tr || !pt || GAS_URL.indexOf("http") !== 0) return;
  post({ action: "suggest", chart: chart, name: $("fName").value.trim(), treatment: tr, part: pt, consent: $("fConsent").checked })
    .then(function (j) {
      if (j.ok) {
        $("fRound").value = j.round;
        $("roundHint").textContent = j.prevRound ? "이전 " + j.prevRound + "회차 확인됨 → " + j.round + "회차 제안 (수정 가능)" : "첫 회차";
      }
    }).catch(function () {});
}

// (v1_5) 차트번호 조회 기능 제거 — 환자 명부는 OK차트 전용이라 대조 불가. 이름은 직접 입력.
$("fChart").addEventListener("change", refreshRound);
$("fName").addEventListener("change", refreshRound);

function setNameState(t, c) {
  var el = $("nameState");
  el.textContent = t;
  el.style.color = c === "ok" ? "#66bb6a" : c === "warn" ? "#ffa726" : c === "bad" ? "#ef5350" : "#8b93a3";
}

// ── 내장 카메라 (연속 촬영, 후면 기본) ──
var camStream = null, camFacing = "environment";

function openCam() {
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: camFacing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
    audio: false
  }).then(function (s) {
    camStream = s;
    $("camView").srcObject = s;
    $("camModal").style.display = "block";
    $("camCnt").textContent = photos.length + "장";
  }).catch(function (e) {
    // 폴백: 내장 카메라 실패 시 기본 카메라 앱 호출
    $("result").textContent = "내장 카메라 사용 불가(" + e.name + ") — 기본 카메라로 전환";
    $("fFilesCam").click();
  });
}

function closeCam() {
  if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
  $("camModal").style.display = "none";
}

function shootFrame() {
  var v = $("camView");
  if (!v.videoWidth) return;
  var c = document.createElement("canvas");
  var scale = Math.min(1, MAX_EDGE / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  var dataUrl = c.toDataURL("image/jpeg", JPEG_Q);
  var item = { b64: dataUrl.split(",")[1], mime: "image/jpeg", status: "대기" };
  photos.push(item);
  renderThumb(item, dataUrl);
  $("btnUp").style.display = "block";
  $("camCnt").textContent = photos.length + "장";
  var f = $("camFlash");
  f.style.opacity = "0.7";
  setTimeout(function () { f.style.opacity = "0"; }, 120);
}

$("btnCam").onclick = openCam;
$("camShut").onclick = shootFrame;
$("camDone").onclick = closeCam;
$("camClose").onclick = closeCam;
$("camFlip").onclick = function () {
  camFacing = camFacing === "environment" ? "user" : "environment";
  closeCam(); openCam();
};

$("btnGal").onclick = function () { $("fFilesGal").click(); };
function onPickFiles() {
  Array.prototype.forEach.call(this.files, function (file) { addPhoto(file); });
  this.value = "";
}
$("fFilesCam").onchange = onPickFiles;
$("fFilesGal").onchange = onPickFiles;

function addPhoto(file) {
  var img = new Image();
  img.onload = function () {
    var w = img.width, h = img.height, scale = Math.min(1, MAX_EDGE / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    var dataUrl = c.toDataURL("image/jpeg", JPEG_Q);
    var item = { b64: dataUrl.split(",")[1], mime: "image/jpeg", status: "대기" };
    photos.push(item);
    renderThumb(item, dataUrl);
    $("btnUp").style.display = "block";
  };
  img.src = URL.createObjectURL(file);
}

function renderThumb(item, dataUrl) {
  var d = document.createElement("div"); d.className = "th";
  var im = document.createElement("img"); im.src = dataUrl;
  var x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
  var st = document.createElement("div"); st.className = "st"; st.textContent = item.status;
  x.onclick = function () { photos.splice(photos.indexOf(item), 1); d.remove(); if (!photos.length) $("btnUp").style.display = "none"; };
  d.appendChild(im); d.appendChild(x); d.appendChild(st);
  item.el = st; item.xBtn = x;
  $("thumbs").appendChild(d);
}

$("btnUp").onclick = function () {
  var chart = $("fChart").value.trim(), name = $("fName").value.trim();
  var ymd = ($("fDate").value || "").replace(/-/g, ""); // YYYYMMDD (원내 실구조와 동일)
  var meta = {
    treatment: getTreatment(), part: getPart(), timing: getTiming(),
    round: Number($("fRound").value) || 1, consent: $("fConsent").checked
  };
  // (v1_6) 비차단 검증: 빈 값은 기본값으로 채워 그대로 진행 (차트번호 1자리부터 허용)
  var warns = [];
  if (chart && !/^\d{1,8}$/.test(chart)) { warns.push("차트번호 형식 이상(숫자만) → 미분류"); chart = ""; }
  if (!chart) { chart = "미분류"; if (!warns.length) warns.push("차트번호 없음 → 미분류 폴더에 저장"); }
  if (!name) { name = "무명"; warns.push("이름 없음 → 무명"); }
  if (!ymd) { var d0 = new Date(); ymd = "" + d0.getFullYear() + String(d0.getMonth() + 1).padStart(2, "0") + String(d0.getDate()).padStart(2, "0"); }
  if (!meta.treatment) meta.treatment = "미지정";
  if (!meta.part) meta.part = "미지정";
  if (!meta.timing) meta.timing = "미지정";
  if (warns.length) $("result").innerHTML = '<span style="color:#ffa726">참고: ' + warns.join(" · ") + '</span>';
  if (GAS_URL.indexOf("http") !== 0) { $("result").textContent = "GAS_URL 미설정 — 배포 후 URL을 넣어주세요"; return; }
  $("btnUp").disabled = true; $("prog").style.display = "block"; $("result").textContent = "";
  uploadAll(chart, name, ymd, meta).then(function (res) {
    $("btnUp").disabled = false;
    var failed = photos.filter(function (p) { return p.status === "실패"; }).length;
    var html = res.complete && !failed
      ? "✅ 완료 — " + res.saved + "장 저장"
      : "⚠️ 저장 " + res.saved + "/" + photos.length + "장" + (failed ? " (실패 " + failed + "장 — 다시 업로드 누르면 실패분만 재시도)" : " — 서버 확인 필요");
    if (failed && lastErr) html += '<br><span style="color:#ffa726">마지막 오류: ' + String(lastErr).slice(0, 120) + '</span>';
    $("result").innerHTML = html + '<br><a href="' + res.folderUrl + '" target="_blank">폴더 열기</a>';
  }).catch(function (e) {
    $("btnUp").disabled = false;
    $("result").textContent = "업로드 중단: " + String(e).slice(0, 160) + " — 네트워크 확인 후 '업로드'를 다시 누르면 이어서 재시도됩니다";
  });
};

var lastErr = null;
function uploadAll(chart, name, ymd, meta) {
  lastErr = null;
  if (navigator.wakeLock && navigator.wakeLock.request) { navigator.wakeLock.request("screen").catch(function () {}); }
  var base = {
    chart: chart, name: name, ymd: ymd,
    treatment: meta.treatment, part: meta.part, round: meta.round,
    timing: meta.timing, consent: meta.consent,
    device: navigator.userAgent.slice(0, 80)
  };
  var pending = photos.map(function (p, i) { return { p: p, seq: i + 1 }; })
    .filter(function (x) { return x.p.status !== "완료"; });
  var done = 0;
  var chain = Promise.resolve();
  pending.forEach(function (x) {
    chain = chain.then(function () {
      x.p.el.textContent = "전송중";
      var payload = Object.assign({ action: "upload", seq: x.seq, total: photos.length, mime: x.p.mime, b64: x.p.b64 }, base);
      return postRetry(payload, 3).then(function (j) {
        if (!j.ok) throw j.error;
        x.p.status = "완료"; x.p.el.textContent = "완료"; x.p.xBtn.style.display = "none";
      }).catch(function (e) {
        x.p.status = "실패"; x.p.el.textContent = "실패";
        lastErr = e;
      }).then(function () {
        done++;
        $("progBar").style.width = Math.round(done / pending.length * 100) + "%";
      });
    });
  });
  return chain.then(function () {
    return post(Object.assign({ action: "finalize", total: photos.length }, base));
  }).then(function (j) {
    if (!j.ok) throw j.error;
    return j;
  });
}

function post(payload, timeoutMs) {
  var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs || 30000) : null;
  return fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
    .then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw "HTTP " + r.status;
      return r.json();
    })
    .catch(function (e) {
      if (timer) clearTimeout(timer);
      throw (e && e.name === "AbortError") ? "시간 초과(30초)" : e;
    });
}

/** n회 재시도 (1.5초 → 3초 백오프) */
function postRetry(payload, tries) {
  return post(payload).catch(function (e) {
    if (tries <= 1) throw e;
    return new Promise(function (r) { setTimeout(r, tries === 3 ? 1500 : 3000); })
      .then(function () { return postRetry(payload, tries - 1); });
  });
}
</script>
</body>
</html>
